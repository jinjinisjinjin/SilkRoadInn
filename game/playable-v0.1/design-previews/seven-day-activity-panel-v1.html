<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>七日活动 · 七日驿令</title>
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box} :root{--ink:#4d3122;--red:#99503f;--red2:#76392f;--gold:#c99b57;--paper:#f1e1bc}
    body{margin:0;min-height:100dvh;color:var(--ink);background:#281b14 url("../assets/kitchen-bg.png") center/cover fixed;font-family:"Songti SC","STSong",serif}
    body:before{content:"";position:fixed;inset:0;background:rgba(35,22,15,.73);backdrop-filter:blur(5px) saturate(.75)}
    button{font:inherit}.stage{position:relative;z-index:1;display:grid;min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));place-items:center}
    .panel{position:relative;width:min(430px,100%);height:min(690px,calc(100dvh - 16px));overflow:hidden;border:2px solid #684630;border-radius:20px;background:repeating-linear-gradient(0deg,rgba(105,70,35,.025) 0 1px,transparent 1px 5px),#f1e2be;box-shadow:inset 0 0 0 3px #fbefcc,inset 0 0 0 7px rgba(125,82,44,.14),0 24px 70px rgba(14,7,3,.65)}
    .panel:after{content:"";position:absolute;z-index:0;inset:112px 9px 9px;pointer-events:none;opacity:.09;background:radial-gradient(circle at 10% 88%,#7a5134 0 2px,transparent 3px),radial-gradient(circle at 88% 32%,#7a5134 0 2px,transparent 3px),linear-gradient(160deg,transparent 49.6%,#7a5134 50% 50.4%,transparent 51%)}
    header{position:relative;z-index:3;height:101px;padding:13px 54px 12px;text-align:center;color:#fff1c9;background:radial-gradient(ellipse at 50% 115%,rgba(229,184,99,.23),transparent 54%),linear-gradient(140deg,#673f32,#9a5844 53%,#673d30);box-shadow:inset 0 -12px 20px rgba(47,23,15,.2),0 3px 0 #c89b59}
    .eyebrow{display:flex;align-items:center;justify-content:center;gap:8px;color:#e9d19b;font-size:9px;font-weight:700;letter-spacing:3px}.eyebrow:before,.eyebrow:after{content:"";width:22px;height:1px;background:currentColor;opacity:.65}
    h1{margin:5px 0 2px;font-size:29px;line-height:1.08;letter-spacing:7px;text-shadow:0 2px 2px #48261d}.subtitle{font-size:10px;letter-spacing:1px;color:#ead7ac}
    .timer{position:absolute;right:10px;bottom:-13px;display:flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid #b58b51;border-radius:13px;color:#714637;background:#faecc7;box-shadow:0 2px 5px rgba(66,40,24,.25);font:700 10px/1 Georgia,"Songti SC",serif}.timer i{width:6px;height:6px;border-radius:50%;background:#a8503d;box-shadow:0 0 0 2px rgba(168,80,61,.14)}
    .close{position:absolute;z-index:8;top:11px;right:11px;width:33px;height:33px;padding:0 0 2px;border:1px solid #d6b675;border-radius:50%;color:#734334;background:linear-gradient(#f9ebc4,#dec38a);box-shadow:inset 0 0 0 2px rgba(255,248,217,.65),0 2px 0 #533529;font:22px/1 Georgia,serif}.close:active{transform:translateY(1px)}
    main{position:relative;z-index:2;height:calc(100% - 101px);padding:21px 13px 54px;overflow-y:auto;scrollbar-width:none}main::-webkit-scrollbar{display:none}
    .weekly{position:relative;padding:9px 8px 8px;border:1px solid #a97d49;border-radius:12px;background:rgba(251,239,205,.83);box-shadow:inset 0 0 0 2px rgba(255,252,232,.72),0 2px 5px rgba(75,48,28,.13)}
    .weekly-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px}.weekly-head span{font-size:11px;font-weight:800;letter-spacing:2px}.weekly-head b{color:#91473a;font:800 12px/1 Georgia,serif}.weekly-head small{color:#806047;font-size:9px}
    .milestones{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:2px}.milestones:before{content:"";position:absolute;top:27px;left:11%;right:11%;height:5px;border-radius:4px;background:linear-gradient(90deg,#a95440 0 var(--week-progress),#bca270 var(--week-progress));box-shadow:inset 0 1px 2px rgba(68,40,22,.3)}
    .milestone{position:relative;z-index:1;display:grid;justify-items:center;gap:2px}.milestone-icon{position:relative;display:grid;width:48px;height:48px;min-height:0;padding:0;place-items:center;border:1px solid #a67b48;border-radius:11px;background:linear-gradient(#f8e6b6,#dfc184);box-shadow:inset 0 0 0 2px rgba(255,247,214,.62),0 2px 4px rgba(73,45,25,.18)}.milestone-icon img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(70,40,22,.2))}.milestone-icon img[src*="generator-materials-v03"]{transform:scale(3.2)}.milestone-icon.claimable{cursor:pointer;animation:milestone-ready 1.8s ease-in-out infinite}.milestone-icon.claimable:after{content:"";position:absolute;right:-4px;top:-4px;width:10px;height:10px;border:2px solid #ffe7ab;border-radius:50%;background:#d74634;box-shadow:0 1px 3px rgba(65,25,17,.45)}.milestone-icon.claimed:after{content:"✓";position:absolute;right:-3px;bottom:-3px;display:grid;width:16px;height:16px;place-items:center;border:1px solid #f0d59b;border-radius:50%;color:#fff1cd;background:#9c4636;font:800 9px/1 sans-serif;transform:rotate(-7deg)}.milestone-icon.current{box-shadow:inset 0 0 0 2px #fff0b4,0 0 0 3px rgba(166,80,61,.18),0 2px 3px rgba(73,45,25,.16)}.milestone b{padding:2px 5px;border-radius:8px;color:#75513a;background:#ead39f;font:700 8px/1 Georgia,serif}.milestone small{max-width:70px;text-align:center;color:#765840;font-size:7px;line-height:1.15}@keyframes milestone-ready{50%{box-shadow:inset 0 0 0 2px #fff0b4,0 0 0 4px rgba(194,128,56,.2),0 3px 6px rgba(73,45,25,.2)}}
    .day-title{display:flex;align-items:flex-end;justify-content:space-between;margin:11px 4px 6px}.day-title strong{font-size:17px;letter-spacing:2px}.day-title span{color:#7c5b43;font-size:9px}.day-title b{color:#91493b;font:700 10px/1 Georgia,serif}
    .tasks{display:grid;gap:7px}.task{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) 112px;align-items:center;gap:7px;min-height:78px;padding:7px 8px;border:1px solid rgba(145,101,58,.52);border-radius:10px;background:linear-gradient(110deg,rgba(255,248,221,.88),rgba(228,201,149,.72));box-shadow:inset 0 0 0 2px rgba(255,250,226,.55),0 2px 4px rgba(73,45,27,.1);cursor:pointer}.task.claimable{border-color:#b77a3f;background:linear-gradient(110deg,rgba(255,245,204,.96),rgba(235,202,135,.82));box-shadow:inset 0 0 0 2px rgba(255,250,219,.7),0 0 0 2px rgba(177,105,55,.1),0 3px 8px rgba(73,45,27,.16)}.task.claimed{cursor:default;opacity:.72}.task:active{transform:translateY(1px)}
    .seal{display:grid;width:34px;height:34px;place-items:center;border:1px solid #c49c5d;color:#fff0c9;background:linear-gradient(145deg,#a65a46,#7e3c32);clip-path:polygon(50% 0,86% 14%,100% 50%,86% 86%,50% 100%,14% 86%,0 50%,14% 14%);font-size:14px;font-weight:900;text-shadow:0 1px #572b22}.task.claimable .seal{color:#6e3b2d;background:linear-gradient(145deg,#f0d295,#c59653);text-shadow:0 1px #ffe9b6}
    .task-copy{min-width:0}.task-copy h2{margin:0 0 3px;font-size:12.5px;letter-spacing:.2px;white-space:nowrap}.progress-row{display:flex;align-items:center;gap:5px}.bar{height:6px;flex:1;overflow:hidden;border-radius:4px;background:#c6aa74;box-shadow:inset 0 1px 2px rgba(75,48,28,.25)}.bar i{display:block;width:var(--progress);height:100%;border-radius:inherit;background:linear-gradient(90deg,#a95240,#d28b55);transition:width .3s ease}.count{min-width:28px;text-align:right;color:#8d4a3b;font:700 9px/1 Georgia,serif}.task-copy p{margin:5px 0 0;color:#85654c;font-size:8px}
    .task-reward{display:grid;grid-template-columns:58px 44px;justify-content:end;align-items:center;gap:6px}.reward-chip{position:relative;display:grid;width:58px;height:60px;place-items:center;border:1px solid rgba(164,118,66,.42);border-radius:12px;background:linear-gradient(145deg,rgba(255,243,205,.92),rgba(218,184,125,.62));box-shadow:inset 0 0 0 2px rgba(255,249,222,.5),0 2px 4px rgba(73,45,27,.15)}.reward-chip img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(62,35,19,.22))}.reward-chip.material-reward img{transform:scale(3.25)}.reward-chip b{position:absolute;right:-2px;bottom:-1px;min-width:16px;padding:1px 3px;border:1px solid rgba(255,234,185,.82);border-radius:7px;color:#fff2d2;background:#8d4638;text-align:center;font:700 8px/1.2 Arial,sans-serif}.claim{width:44px;min-height:27px;padding:0 3px;border:1px solid #75362d;border-radius:12px;color:#ffedc3;background:linear-gradient(#ac5a46,#813b32);box-shadow:inset 0 1px rgba(255,220,164,.3),0 2px 0 #5c3028;font-size:9px;font-weight:800}.claim:disabled{border-color:#aa8d5d;color:#80664a;background:#d8c18d;box-shadow:inset 0 1px rgba(255,247,214,.55);opacity:.86}.claimable .claim{animation:claim-pulse 1.7s ease-in-out infinite}@keyframes claim-pulse{50%{box-shadow:inset 0 1px rgba(255,220,164,.3),0 2px 0 #5c3028,0 0 0 3px rgba(166,80,61,.16)}}
    .day-tabs{position:absolute;z-index:5;right:9px;bottom:7px;left:9px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:end}.day-tab{position:relative;height:39px;padding:3px 0 0;border:1px solid #8c4a39;border-radius:4px 4px 8px 8px;color:#ffe9bd;background:linear-gradient(#a75543,#803b32);box-shadow:inset 0 1px rgba(255,220,167,.25),0 2px 2px rgba(60,32,23,.25);font-weight:800}.day-tab:after{content:"";position:absolute;bottom:-4px;left:50%;width:9px;height:9px;background:#833e33;transform:translateX(-50%) rotate(45deg);z-index:-1}.day-tab small{display:block;font-size:7px;letter-spacing:1px}.day-tab b{display:block;font:800 15px/1.05 Georgia,serif}.day-tab.has-reward:before{content:"";position:absolute;z-index:3;top:-4px;right:-3px;width:10px;height:10px;border:2px solid #ffe4a7;border-radius:50%;background:#d74634;box-shadow:0 1px 3px rgba(62,24,17,.55)}.day-tab.active{height:47px;color:#814738;background:linear-gradient(#fff0c8,#e3c58b);border-color:#a87a44;box-shadow:inset 0 0 0 2px rgba(255,249,222,.68),0 3px 5px rgba(60,32,23,.28)}.day-tab.active:after{background:#e2c48b}
    .note{margin:8px 0 0;text-align:center;color:#7f6048;font-size:8px}.toast{position:fixed;z-index:20;left:50%;bottom:max(62px,env(safe-area-inset-bottom));padding:8px 14px;border:1px solid #d0ad70;border-radius:20px;color:#fff0cf;background:rgba(81,46,34,.96);box-shadow:0 5px 18px rgba(20,10,5,.36);transform:translate(-50%,16px);opacity:0;transition:.2s;pointer-events:none;font-size:11px;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:370px){.panel{height:min(680px,calc(100dvh - 10px))}header{height:94px;padding-top:11px}h1{font-size:26px}main{height:calc(100% - 94px);padding-top:19px}.task{min-height:73px;grid-template-columns:33px minmax(0,1fr) 106px;gap:6px}.task-copy h2{font-size:11.5px}.task-reward{grid-template-columns:55px 42px;gap:5px}.reward-chip{width:55px;height:57px}.reward-chip img{width:51px;height:51px}.claim{width:42px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="stage">
    <section class="panel" aria-label="七日活动面板">
      <button class="close" aria-label="关闭">×</button>
      <header><div class="eyebrow">流沙驿 · 每周委托</div><h1>七日驿令</h1><div class="subtitle">每日皆有新委托，完成即得行礼</div><div class="timer"><i></i>余 4日 12时</div></header>
      <main>
        <section class="weekly">
          <div class="weekly-head"><span>本周进度</span><small>完成任务可解锁阶段礼</small><b id="weekScore">9 / 28</b></div>
          <div class="milestones" id="milestones">
            <div class="milestone" data-score="4" data-reward="铜币棋子"><button class="milestone-icon" type="button"><img src="../assets/ui/bonus_coin_lv02.png" alt="铜币棋子"></button><b>4项</b><small>铜币棋子</small></div>
            <div class="milestone" data-score="10" data-reward="原料包×3"><button class="milestone-icon" type="button"><img src="../assets/generator-materials-v03/generator_material_milk_room_01.png" alt="原料包"></button><b>10项</b><small>原料包×3</small></div>
            <div class="milestone" data-score="18" data-reward="红宝石×3"><button class="milestone-icon" type="button"><img src="../assets/ui/bonus_ruby_lv02.png" alt="红宝石"></button><b>18项</b><small>红宝石×3</small></div>
            <div class="milestone" data-score="28" data-reward="西行珍匣"><button class="milestone-icon" type="button"><img src="../assets/ui/order_gift_coffer_v1.png" alt="西行珍匣"></button><b>28项</b><small>西行珍匣</small></div>
          </div>
        </section>
        <div class="day-title"><div><strong id="dayTitle">第三日 · 炉火渐旺</strong><span>　达成后手动领取</span></div><b id="dayProgress">1/4</b></div>
        <section class="tasks" id="tasks"></section>
      </main>
      <nav class="day-tabs" id="dayTabs" aria-label="选择活动日期"></nav>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const A='../assets/';
    const days=[
      {title:'初到驿门',tasks:[['单','完成 24 份订单',24,24,'hubing_lv02_lubing_cutout.png','炉饼',1],['合','完成 800 次食材合成',800,800,'generator-materials-v03/generator_material_mill_01.png','磨坊木件',2],['钱','累计获得 300 枚铜钱',300,300,'ui/bonus_coin_lv01.png','铜币棋子',1],['玉','累计使用 30 枚红宝石',30,30,'ui/bonus_ruby_lv01.png','红宝石',1]]},
      {title:'乳香入盏',tasks:[['单','完成 32 份订单',32,32,'dairy_lv02_rumi.png','乳糜',1],['玉','累计使用 40 枚红宝石',40,40,'generator-materials-v03/generator_material_milk_room_01.png','奶房木件',2],['合','完成 1000 次食材合成',1000,1000,'ui/bonus_coin_lv01.png','铜币棋子',2],['鉴','点亮 2 项新食鉴',2,2,'ui/bonus_ruby_lv01.png','红宝石',1]]},
      {title:'炉火渐旺',tasks:[['单','完成 40 份订单',24,40,'spice_lv02_ziran_mo.png','孜然末',1],['合','完成 1200 次食材合成',540,1200,'generator-materials-v03/generator_material_spice_01.png','香料木件',2],['钱','累计获得 800 枚铜钱',460,800,'ui/bonus_coin_lv02.png','铜币棋子',1],['宴','交付 16 份含 Lv3 食材的订单',16,16,'ui/bonus_ruby_lv01.png','红宝石',2]]},
      {title:'绿洲来果',tasks:[['单','完成 48 份订单',0,48,'fruit_lv02_gan_putao.png','干葡萄',1],['玉','累计使用 60 枚红宝石',0,60,'generator-materials-v03/generator_material_fruit_01.png','果圃木件',2],['合','合成出 16 份 Lv4 食材',0,16,'items/tools/ui_scissors_splitter_v1.png','拆解剪',1],['钱','累计获得 1200 枚铜钱',0,1200,'ui/bonus_coin_lv02.png','铜币棋子',1]]},
      {title:'酒浆满案',tasks:[['单','完成 56 份订单',0,56,'drink_lv02_putaojiang.png','葡萄浆',1],['玉','累计使用 80 枚红宝石',0,80,'generator-materials-v03/generator_material_drink_01.png','饮品木件',2],['鉴','点亮 4 项新食鉴',0,4,'ui/bonus_ruby_lv02.png','红宝石',1],['宴','交付 32 份含 Lv3 食材的订单',0,32,'ui/bonus_coin_lv02.png','铜币棋子',2]]},
      {title:'商旅成行',tasks:[['单','完成 64 份订单',0,64,'meat_lv03_roupu.png','肉脯',1],['玉','累计使用 100 枚红宝石',0,100,'generator-materials-v03/generator_material_meat_01.png','肉铺木件',2],['合','完成 1800 次食材合成',0,1800,'ui/bonus_ruby_lv02.png','红宝石',1],['钱','累计获得 1800 枚铜钱',0,1800,'ui/bonus_coin_lv03.png','铜币棋子',1]]},
      {title:'七日成宴',tasks:[['单','完成 72 份订单',0,72,'hubing_lv04_youhubing.png','油胡饼',1],['宴','交付 40 份含 Lv4 食材的订单',0,40,'ui/ui_baiwei_jinjian_v1.png','百味金笺',1],['合','完成 2400 次食材合成',0,2400,'ui/bonus_ruby_lv02.png','红宝石',2],['玉','累计使用 120 枚红宝石',0,120,'generator-materials-v03/generator_material_mill_01.png','自选原料包',4]]}
    ];
    days[0].tasks.forEach(task=>task[7]=true);days[1].tasks.forEach(task=>task[7]=true);
    days[2].tasks[3][7]=false;
    let activeDay=2;const tasksEl=document.querySelector('#tasks'),tabsEl=document.querySelector('#dayTabs'),toast=document.querySelector('#toast');
    function taskDone(task){return task[2]>=task[3]}
    function taskClaimable(task){return taskDone(task)&&task[7]!==true}
    function completedCount(){return days.flatMap(day=>day.tasks).filter(taskDone).length}
    function renderTabs(){tabsEl.innerHTML='';days.forEach((day,index)=>{const b=document.createElement('button');b.className='day-tab'+(day.tasks.some(taskClaimable)?' has-reward':'')+(index===activeDay?' active':'');b.innerHTML=`<small>第</small><b>${index+1}</b>`;b.setAttribute('aria-label',`第${index+1}日 ${day.title}${day.tasks.some(taskClaimable)?'，有奖励可领取':''}`);b.onclick=()=>{activeDay=index;render()};tabsEl.append(b)})}
    const claimedMilestones=new Set();
    function renderMilestones(){const score=completedCount(),milestones=[...document.querySelectorAll('.milestone')],nextIndex=milestones.findIndex(x=>score<Number(x.dataset.score));document.querySelector('#weekScore').textContent=`${score} / 28`;document.querySelector('#milestones').style.setProperty('--week-progress',`${Math.min(100,score/28*100)}%`);milestones.forEach((m,index)=>{const target=Number(m.dataset.score),icon=m.querySelector('.milestone-icon'),claimed=claimedMilestones.has(target),claimable=score>=target&&!claimed;icon.className='milestone-icon'+(claimed?' claimed':claimable?' claimable':index===nextIndex?' current':'');icon.disabled=!claimable;icon.setAttribute('aria-label',claimed?`${m.dataset.reward}已领取`:claimable?`领取${m.dataset.reward}`:`完成${target}项任务解锁${m.dataset.reward}`)})}
    function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
    function renderTasks(){const day=days[activeDay];document.querySelector('#dayTitle').textContent=`第${activeDay+1}日 · ${day.title}`;document.querySelector('#dayProgress').textContent=`${day.tasks.filter(taskDone).length}/4`;tasksEl.innerHTML='';day.tasks.forEach(task=>{const done=taskDone(task),claimed=task[7]===true,claimable=done&&!claimed,article=document.createElement('article'),materialClass=task[4].includes('generator-materials-v03/')?' material-reward':'';article.className='task'+(claimable?' claimable':'')+(claimed?' claimed':'');const stateText=claimed?'已领取':claimable?'任务达成 · 奖励待领取':'';article.innerHTML=`<div class="seal">${task[0]}</div><div class="task-copy"><h2>${task[1]}</h2><div class="progress-row"><span class="bar"><i style="--progress:${Math.min(100,task[2]/task[3]*100)}%"></i></span><b class="count">${task[2]}/${task[3]}</b></div>${stateText?`<p>${stateText}</p>`:''}</div><div class="task-reward"><span class="reward-chip${materialClass}"><img src="${A+task[4]}" alt="${task[5]}"><b>×${task[6]}</b></span><button class="claim" ${claimable?'':'disabled'}>${claimed?'已领取':claimable?'领取':'未完成'}</button></div>`;article.onclick=()=>{if(done)return;task[2]=task[3];showToast(`任务已达成，${task[5]}可以领取`);render()};article.querySelector('.claim').onclick=event=>{event.stopPropagation();if(!taskClaimable(task))return;task[7]=true;showToast(`${task[5]} ×${task[6]} 已收入奖励行囊`);render()};tasksEl.append(article)})}
    document.querySelectorAll('.milestone-icon').forEach(icon=>{icon.onclick=()=>{const milestone=icon.closest('.milestone'),target=Number(milestone.dataset.score);if(completedCount()<target||claimedMilestones.has(target))return;claimedMilestones.add(target);showToast(`${milestone.dataset.reward} 已收入奖励行囊`);renderMilestones()}});
    document.querySelector('.close').onclick=()=>{if(new URLSearchParams(location.search).get('from')==='board')history.back()};
    function render(){renderTabs();renderMilestones();renderTasks()}render();
  </script>
</body>
</html>
